<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WildTracks</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<style>
  *{box-sizing:border-box;}
  body{margin:0;background:#101a2e;color:#fff;font-family:'Segoe UI',sans-serif;}
  
  /* LOGIN */
  .login-container{display:flex;justify-content:center;align-items:center;min-height:100vh;background:#101a2e;}
  .login-box{background:#1a1a2e;padding:40px;border-radius:8px;border:1px solid #a855f7;text-align:center;max-width:400px;width:100%;}
  .login-box h1{color:#a855f7;margin-bottom:10px;}
  .login-box button{background:#a855f7;color:#fff;border:none;padding:12px 24px;border-radius:6px;font-size:16px;cursor:pointer;width:100%;}
  .login-box button:hover{opacity:0.8;}
  
  /* GLAVNI SADRŽAJ */
  #mainApp{display:none;padding:20px;max-width:1200px;margin:0 auto;}
  
  /* HEADER */
  .header{display:flex;justify-content:space-between;align-items:center;background:#1a1a2e;padding:16px 24px;border-radius:8px;border:1px solid #a855f7;margin-bottom:20px;}
  .header h1{color:#a855f7;font-size:24px;margin:0;}
  .header .user-info{display:flex;align-items:center;gap:12px;}
  .header .user-info span{font-size:14px;color:#aaa;}
  .header .user-info button{background:#a855f7;color:#fff;border:none;padding:8px 16px;border-radius:4px;cursor:pointer;font-size:13px;}
  .header .user-info button:hover{opacity:0.8;}
  
  /* DASHBOARD DROPDOWN */
  .dashboard-dropdown{background:#1a1a2e;border:1px solid #a855f7;border-radius:8px;margin-bottom:20px;overflow:hidden;}
  .dashboard-dropdown .dash-header{display:flex;justify-content:space-between;align-items:center;padding:14px 20px;cursor:pointer;}
  .dashboard-dropdown .dash-header:hover{background:#a855f724;}
  .dashboard-dropdown .dash-header h2{color:#a855f7;font-size:18px;margin:0;}
  .dashboard-dropdown .dash-header .badge{background:#a855f7;color:#fff;border-radius:4px;padding:2px 10px;font-size:12px;}
  .dashboard-dropdown .dash-header .arrow{color:#a855f7;font-size:18px;transition:transform 0.3s;}
  .dashboard-dropdown .dash-header .arrow.open{transform:rotate(180deg);}
  .dashboard-dropdown .dash-body{max-height:0;overflow:hidden;transition:max-height 0.4s ease;padding:0 20px;}
  .dashboard-dropdown .dash-body.open{max-height:800px;padding:0 20px 20px 20px;}
  
  /* DASHBOARD KARTICE */
  .dash-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:16px;}
  @media(max-width:800px){.dash-grid{grid-template-columns:repeat(2,1fr);}}
  @media(max-width:500px){.dash-grid{grid-template-columns:1fr;}}
  
  .dash-card{background:#121a2f;border:1px solid #a855f7;border-radius:6px;padding:16px;}
  .dash-card h4{font-size:10px;text-transform:uppercase;color:#888;margin:0 0 6px 0;letter-spacing:0.05em;}
  .dash-card .big-num{font-size:28px;font-weight:900;color:#a855f7;}
  
  .dash-row{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px;}
  @media(max-width:700px){.dash-row{grid-template-columns:1fr;}}
  
  .dash-wide{background:#121a2f;border:1px solid #a855f7;border-radius:6px;padding:16px;}
  .dash-wide h4{font-size:10px;text-transform:uppercase;color:#888;margin:0 0 10px 0;letter-spacing:0.05em;}
  
  .dash-empty{color:#666;font-style:italic;padding:8px 0;}
  .cat-bar-row{display:flex;align-items:center;gap:10px;margin-bottom:6px;}
  .cat-bar-label{width:120px;font-size:12px;color:#fff;text-align:right;}
  .cat-bar-track{flex:1;height:6px;background:#2a2a4a;border-radius:4px;overflow:hidden;}
  .cat-bar-fill{height:100%;border-radius:4px;}
  .cat-bar-num{width:30px;font-size:12px;color:#888;}
  
  .upcoming-item{display:flex;align-items:center;gap:12px;padding:6px 0;border-bottom:1px solid #2a2a4a;cursor:pointer;}
  .upcoming-item:hover{opacity:0.7;}
  .upcoming-dot{width:8px;height:8px;border-radius:50%;background:#a855f7;}
  .upcoming-title{font-size:13px;color:#fff;}
  
  .nav-bar{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap;}
  .nav-bar button{background:#1a1a2e;border:1px solid #a855f7;color:#888;padding:10px 18px;border-radius:6px;cursor:pointer;font-size:13px;font-weight:600;}
  .nav-bar button.active{background:#a855f7;color:#fff;}
  .nav-bar button:hover{opacity:0.8;}
  
  .tab-panel{display:none;}
  .tab-panel.active{display:block;}
  
  .bottom-bar{position:fixed;bottom:40px;left:0;right:0;display:flex;justify-content:center;z-index:40;}
  .bottom-bar button{background:#a855f7;color:#fff;border:none;padding:12px 28px;border-radius:6px;font-size:15px;font-weight:700;cursor:pointer;}
  .bottom-bar button:hover{opacity:0.8;}
  
  .footer-legal{position:fixed;bottom:0;left:0;right:0;text-align:center;padding:4px;background:#101a2e;font-size:8px;color:#666;border-top:1px solid #a855f7;z-index:30;}
  .footer-legal a{color:#a855f7;text-decoration:none;}
  
  .loading{text-align:center;padding:40px;color:#888;}
</style>
</head>
<body>

<!-- ===== LOGIN EKRAN ===== -->
<div class="login-container" id="loginScreen">
  <div class="login-box">
    <h1>🐾 WildTracks</h1>
    <p style="color:#aaa;">Sign in to continue</p>
    <button onclick="signInWithGoogle()">🔑 Sign in with Google</button>
  </div>
</div>

<!-- ===== GLAVNI SADRŽAJ ===== -->
<div id="mainApp">
  <!-- HEADER -->
  <div class="header">
    <h1>🐾 WildTracks</h1>
    <div class="user-info">
      <span id="userName">User</span>
      <button onclick="signOut()">Sign Out</button>
    </div>
  </div>

  <!-- NAVIGACIJA -->
  <div class="nav-bar">
    <button class="active" onclick="switchTab('dashboard')">Dashboard</button>
    <button onclick="switchTab('projects')">Projects</button>
    <button onclick="switchTab('gear')">Gear</button>
  </div>

  <!-- ===== DASHBOARD PANEL ===== -->
  <div class="tab-panel active" id="panel-dashboard">
    <div class="dashboard-dropdown">
      <div class="dash-header" onclick="toggleDashboard()">
        <h2>📊 Dashboard <span class="badge" id="dashBadge">0</span></h2>
        <span class="arrow" id="dashArrow">▼</span>
      </div>
      <div class="dash-body open" id="dashBody">
        <div class="dash-grid" id="dashStats"></div>
        <div class="dash-row">
          <div class="dash-wide"><h4>BY CATEGORY</h4><div id="dashCategories"></div></div>
          <div class="dash-wide"><h4>STATUS</h4><div id="dashStatus"></div></div>
        </div>
        <div class="dash-row">
          <div class="dash-wide"><h4>AVERAGE TIME</h4><div id="dashAvgTime"></div></div>
          <div class="dash-wide"><h4>UPCOMING</h4><div id="dashUpcoming"></div></div>
        </div>
      </div>
    </div>
  </div>

  <!-- ===== PROJECTS PANEL ===== -->
  <div class="tab-panel" id="panel-projects">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:10px;">
      <h2 style="color:#a855f7;margin:0;">📂 Projects</h2>
      <button onclick="openProjectModal()" style="background:#a855f7;color:#fff;border:none;padding:10px 20px;border-radius:6px;cursor:pointer;font-weight:600;">+ New Project</button>
    </div>
    <div id="projectList" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;"></div>
  </div>

  <!-- ===== GEAR PANEL ===== -->
  <div class="tab-panel" id="panel-gear">
    <h2 style="color:#a855f7;">📦 Gear</h2>
    <p style="color:#888;">Gear management coming soon...</p>
  </div>
</div>

<!-- ===== BOTTOM BAR ===== -->
<div class="bottom-bar">
  <button onclick="openProjectModal()">➕ New Project</button>
</div>

<!-- ===== FOOTER ===== -->
<div class="footer-legal">
  © 2026 WildTracks — All Rights Reserved
</div>

<!-- ===== PROJECT MODAL ===== -->
<div id="projectModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.8);z-index:100;display:none;justify-content:center;align-items:center;padding:20px;">
  <div style="background:#1a1a2e;border:1px solid #a855f7;border-radius:8px;padding:24px;max-width:500px;width:100%;">
    <h2 style="color:#a855f7;margin-top:0;" id="modalTitle">New Project</h2>
    <input type="text" id="fTitle" placeholder="Title *" style="width:100%;padding:10px;margin-bottom:12px;border-radius:4px;border:1px solid #333;background:#121a2f;color:#fff;">
    <input type="text" id="fLocation" placeholder="Location *" style="width:100%;padding:10px;margin-bottom:12px;border-radius:4px;border:1px solid #333;background:#121a2f;color:#fff;">
    <input type="date" id="fDue" style="width:100%;padding:10px;margin-bottom:12px;border-radius:4px;border:1px solid #333;background:#121a2f;color:#fff;">
    <textarea id="fNotes" placeholder="Notes" style="width:100%;padding:10px;border-radius:4px;border:1px solid #333;background:#121a2f;color:#fff;min-height:80px;resize:vertical;"></textarea>
    <div style="display:flex;gap:8px;margin-top:16px;">
      <button onclick="closeProjectModal()" style="flex:1;background:#333;color:#fff;border:none;padding:10px;border-radius:4px;cursor:pointer;">Cancel</button>
      <button onclick="saveProject()" style="flex:2;background:#a855f7;color:#fff;border:none;padding:10px;border-radius:4px;cursor:pointer;font-weight:600;">Save</button>
    </div>
  </div>
</div>

<script>
// ============ FIREBASE ============
const firebaseConfig = {
  apiKey: "AIzaSyA9T9DjOwF89dXfZ2zBuL33muRHHloY_ec",
  authDomain: "wildtracks-36c7b.firebaseapp.com",
  projectId: "wildtracks-36c7b",
  storageBucket: "wildtracks-36c7b.firebasestorage.app",
  messagingSenderId: "571653091041",
  appId: "1:571653091041:web:20255d0ae39aa4702c51a0"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

// ============ DATA ============
let items = [];
let currentUser = null;
let editingId = null;
let dashboardOpen = true;

// ============ AUTH ============
function signInWithGoogle() {
  auth.signInWithPopup(new firebase.auth.GoogleAuthProvider())
    .catch(e => alert('Error: ' + e.message));
}

function signOut() {
  auth.signOut();
}

auth.onAuthStateChanged(user => {
  currentUser = user;
  if (user) {
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('mainApp').style.display = 'block';
    document.getElementById('userName').textContent = user.displayName || user.email;
    loadProjects();
  } else {
    document.getElementById('loginScreen').style.display = 'flex';
    document.getElementById('mainApp').style.display = 'none';
  }
});

// ============ PROJECTS ============
async function loadProjects() {
  if (!currentUser) return;
  try {
    const snapshot = await db.collection('users').doc(currentUser.uid)
      .collection('projects').orderBy('createdAt', 'desc').get();
    items = [];
    snapshot.forEach(doc => {
      items.push({ id: doc.id, ...doc.data() });
    });
    renderProjects();
    renderDashboard();
  } catch(e) {
    console.error('Load error:', e);
  }
}

function renderProjects() {
  const container = document.getElementById('projectList');
  if (!items.length) {
    container.innerHTML = '<div class="dash-empty">No projects yet. Create one!</div>';
    return;
  }
  container.innerHTML = items.map(p => `
    <div style="background:#121a2f;border:1px solid #a855f7;border-radius:6px;padding:16px;cursor:pointer;" onclick="editProject('${p.id}')">
      <h3 style="color:#fff;margin:0 0 6px 0;">${escapeHtml(p.title)}</h3>
      <p style="color:#888;font-size:13px;margin:0 0 4px 0;">📍 ${escapeHtml(p.location||'N/A')}</p>
      <p style="color:#666;font-size:12px;margin:0;">📅 ${p.due || 'N/A'}</p>
      <div style="margin-top:8px;display:flex;gap:6px;">
        <button onclick="event.stopPropagation();deleteProject('${p.id}')" style="background:#dc2626;color:#fff;border:none;padding:4px 12px;border-radius:4px;cursor:pointer;font-size:12px;">Delete</button>
      </div>
    </div>
  `).join('');
}

function openProjectModal() {
  editingId = null;
  document.getElementById('modalTitle').textContent = 'New Project';
  document.getElementById('fTitle').value = '';
  document.getElementById('fLocation').value = '';
  document.getElementById('fDue').value = '';
  document.getElementById('fNotes').value = '';
  document.getElementById('projectModal').style.display = 'flex';
}

function closeProjectModal() {
  document.getElementById('projectModal').style.display = 'none';
}

function editProject(id) {
  const p = items.find(i => i.id === id);
  if (!p) return;
  editingId = id;
  document.getElementById('modalTitle').textContent = 'Edit Project';
  document.getElementById('fTitle').value = p.title || '';
  document.getElementById('fLocation').value = p.location || '';
  document.getElementById('fDue').value = p.due || '';
  document.getElementById('fNotes').value = p.notes || '';
  document.getElementById('projectModal').style.display = 'flex';
}

async function saveProject() {
  const title = document.getElementById('fTitle').value.trim();
  const location = document.getElementById('fLocation').value.trim();
  const due = document.getElementById('fDue').value;
  const notes = document.getElementById('fNotes').value.trim();
  if (!title) { alert('Enter title.'); return; }
  if (!location) { alert('Enter location.'); return; }
  if (!due) { alert('Select date.'); return; }

  const data = { title, location, due, notes, updatedAt: new Date().toISOString() };
  
  try {
    if (editingId) {
      await db.collection('users').doc(currentUser.uid)
        .collection('projects').doc(editingId).update(data);
    } else {
      data.createdAt = new Date().toISOString();
      await db.collection('users').doc(currentUser.uid)
        .collection('projects').add(data);
    }
    closeProjectModal();
    loadProjects();
  } catch(e) {
    alert('Error: ' + e.message);
  }
}

async function deleteProject(id) {
  if (!confirm('Delete this project?')) return;
  try {
    await db.collection('users').doc(currentUser.uid)
      .collection('projects').doc(id).delete();
    loadProjects();
  } catch(e) {
    alert('Error: ' + e.message);
  }
}

// ============ DASHBOARD ============
function renderDashboard() {
  const total = items.length;
  document.getElementById('dashBadge').textContent = total;
  
  // Stats
  document.getElementById('dashStats').innerHTML = `
    <div class="dash-card"><h4>Total</h4><div class="big-num">${total}</div></div>
    <div class="dash-card"><h4>This Week</h4><div class="big-num">0</div></div>
    <div class="dash-card"><h4>This Month</h4><div class="big-num">0</div></div>
    <div class="dash-card"><h4>Tomorrow</h4><div class="big-num">0</div></div>
  `;
  
  // Categories
  const cats = {};
  items.forEach(p => {
    const c = p.category || 'Uncategorized';
    cats[c] = (cats[c] || 0) + 1;
  });
  const maxCat = Math.max(1, ...Object.values(cats));
  document.getElementById('dashCategories').innerHTML = Object.entries(cats).length ? 
    Object.entries(cats).map(([k,v]) => `
      <div class="cat-bar-row">
        <span class="cat-bar-label">${escapeHtml(k)}</span>
        <div class="cat-bar-track"><div class="cat-bar-fill" style="width:${(v/maxCat)*100}%;background:#a855f7;"></div></div>
        <span class="cat-bar-num">${v}</span>
      </div>
    `).join('') : '<div class="dash-empty">No categories</div>';
  
  document.getElementById('dashStatus').innerHTML = '<div class="dash-empty">No status data</div>';
  document.getElementById('dashAvgTime').innerHTML = '<div class="dash-empty">No data yet</div>';
  document.getElementById('dashUpcoming').innerHTML = '<div class="dash-empty">No upcoming</div>';
}

// ============ DASHBOARD TOGGLE ============
function toggleDashboard() {
  dashboardOpen = !dashboardOpen;
  const body = document.getElementById('dashBody');
  const arrow = document.getElementById('dashArrow');
  if (dashboardOpen) {
    body.classList.add('open');
    arrow.classList.add('open');
  } else {
    body.classList.remove('open');
    arrow.classList.remove('open');
  }
}

// ============ NAVIGATION ============
function switchTab(tab) {
  document.querySelectorAll('.nav-bar button').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  
  const btnMap = { dashboard: 0, projects: 1, gear: 2 };
  document.querySelectorAll('.nav-bar button')[btnMap[tab]]?.classList.add('active');
  document.getElementById('panel-' + tab).classList.add('active');
}

// ============ HELPERS ============
function escapeHtml(s) {
  const d = document.createElement('div');
  d.textContent = s || '';
  return d.innerHTML;
}

// ============ INIT ============
console.log('🐾 WildTracks loaded');
</script>
</body>
</html>
